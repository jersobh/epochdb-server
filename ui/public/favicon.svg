<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#080A0F" />
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#14B8A6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.6" />
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#080A0F" stop-opacity="0" />
    </radialGradient>

    <!-- E Spine Gradient (Cyan to Violet) -->
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Top Tier Gradient (Hot Tier: Cyan/Teal) -->
    <linearGradient id="topBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Mid Tier Gradient (KG: Cyan to Indigo) -->
    <linearGradient id="midBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Bottom Tier Gradient (Cold Tier: Indigo to Deep Violet) -->
    <linearGradient id="botBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Orbit Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#14B8A6" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#818CF8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.15" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Core Ambient Glow -->
  <circle cx="32" cy="32" r="22" fill="url(#coreGlow)" />

  <!-- Temporal Orbit Ring (The "Epoch" Cycle) -->
  <ellipse cx="32" cy="32" rx="23" ry="10" transform="rotate(-28 32 32)" fill="none" stroke="url(#orbitGrad)" stroke-width="2" stroke-dasharray="28 6 12 5" />

  <!-- Orbiting Temporal Pulse Atom -->
  <circle cx="50" cy="22" r="3.2" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="50" cy="22" r="1.5" fill="#FFFFFF" />

  <!-- Neuro-Symbolic Knowledge Mesh Links -->
  <line x1="20" y1="32" x2="44" y2="19" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3 3" />
  <line x1="20" y1="32" x2="44" y2="45" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3 3" />

  <!-- Epoch "E" Structural Bars -->
  <!-- Vertical Spine -->
  <line x1="20" y1="19" x2="20" y2="45" stroke="url(#spineGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Top Bar (Hot Tier) -->
  <line x1="20" y1="19" x2="44" y2="19" stroke="url(#topBarGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Middle Bar (Knowledge Graph) -->
  <line x1="20" y1="32" x2="36" y2="32" stroke="url(#midBarGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Bottom Bar (Cold Tier) -->
  <line x1="20" y1="45" x2="44" y2="45" stroke="url(#botBarGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Knowledge Graph Nodes (Atoms) -->
  <!-- Top-Right Node (Hot Tier Vector) -->
  <circle cx="44" cy="19" r="4" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="44" cy="19" r="2" fill="#FFFFFF" />

  <!-- Central Hub Node (Knowledge Mesh Anchor) -->
  <circle cx="20" cy="32" r="4.5" fill="#2DD4BF" filter="url(#glow)" />
  <circle cx="20" cy="32" r="2" fill="#FFFFFF" />

  <!-- Middle-Right Node (Entity Relation) -->
  <circle cx="36" cy="32" r="3.5" fill="#818CF8" filter="url(#glow)" />
  <circle cx="36" cy="32" r="1.5" fill="#FFFFFF" />

  <!-- Bottom-Right Node (Cold Tier Parquet Storage) -->
  <circle cx="44" cy="45" r="4" fill="#6366F1" filter="url(#glow)" />
  <circle cx="44" cy="45" r="2" fill="#FFFFFF" />

  <!-- Micro-Highlights on Spine Terminals -->
  <circle cx="20" cy="19" r="2" fill="#E6FFFA" />
  <circle cx="20" cy="45" r="2" fill="#EEF2FF" />
</svg>
