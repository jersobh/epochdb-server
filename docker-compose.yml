networks:
  epochdb:
    name: epochdb-server_default

services:
  shard0:
    build: .
    container_name: epochdb-shard0
    networks:
      - epochdb
    ports:
      - "8081:8080"
    environment:
      - NODE_MODE=shard
      - STORAGE_DIR=/data
      - INTERNAL_AUTH_TOKEN=test-internal-token-67890
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-384}
      - EPOCHDB_EXTRACTION_MODEL=${EPOCHDB_EXTRACTION_MODEL:-local}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
    volumes:
      - shard0_data:/data
      - ./src:/app/src:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 24
      # First boot may download/load the embedding model (~30–90s).
      start_period: 90s

  shard1:
    build: .
    container_name: epochdb-shard1
    networks:
      - epochdb
    ports:
      - "8082:8080"
    environment:
      - NODE_MODE=shard
      - STORAGE_DIR=/data
      - INTERNAL_AUTH_TOKEN=test-internal-token-67890
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-384}
      - EPOCHDB_EXTRACTION_MODEL=${EPOCHDB_EXTRACTION_MODEL:-local}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
    volumes:
      - shard1_data:/data
      - ./src:/app/src:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 90s

  shard2:
    build: .
    container_name: epochdb-shard2
    networks:
      - epochdb
    ports:
      - "8083:8080"
    environment:
      - NODE_MODE=shard
      - STORAGE_DIR=/data
      - INTERNAL_AUTH_TOKEN=test-internal-token-67890
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-384}
      - EPOCHDB_EXTRACTION_MODEL=${EPOCHDB_EXTRACTION_MODEL:-local}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
    volumes:
      - shard2_data:/data
      - ./src:/app/src:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 90s

  coordinator:
    build: .
    container_name: epochdb-coordinator
    networks:
      - epochdb
    ports:
      - "8080:8080"
    environment:
      - NODE_MODE=coordinator
      - SHARD_NODES=http://shard0:8080,http://shard1:8080,http://shard2:8080
      - API_KEY=test-api-key-12345
      - INTERNAL_AUTH_TOKEN=test-internal-token-67890
    volumes:
      - ./src:/app/src:ro
    depends_on:
      shard0:
        condition: service_healthy
      shard1:
        condition: service_healthy
      shard2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  shard0_data:
  shard1_data:
  shard2_data:
