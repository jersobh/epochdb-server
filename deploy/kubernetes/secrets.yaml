apiVersion: v1
kind: ConfigMap
metadata:
  name: epochdb-config
  namespace: epochdb
data:
  EMBEDDING_MODEL: "all-MiniLM-L6-v2"
  EMBEDDING_DIM: "384"
  NODE_MODE_SHARD: "shard"
  NODE_MODE_COORDINATOR: "coordinator"

---
apiVersion: v1
kind: Secret
metadata:
  name: epochdb-secrets
  namespace: epochdb
type: Opaque
data:
  # Base64 encoded test values:
  # test-api-key-12345 -> dGVzdC1hcGkta2V5LTEyMzQ1
  # test-internal-token-67890 -> dGVzdC1pbnRlcm5hbC10b2tlbi02Nzg5MA==
  API_KEY: dGVzdC1hcGkta2V5LTEyMzQ1
  INTERNAL_AUTH_TOKEN: dGVzdC1pbnRlcm5hbC10b2tlbi02Nzg5MA==
