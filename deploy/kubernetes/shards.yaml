apiVersion: v1
kind: Service
metadata:
  name: epochdb-shard-service
  namespace: epochdb
  labels:
    app: epochdb-shard
spec:
  ports:
  - port: 8080
    name: http
  clusterIP: None
  selector:
    app: epochdb-shard

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: epochdb-shard
  namespace: epochdb
spec:
  serviceName: "epochdb-shard-service"
  replicas: 3
  selector:
    matchLabels:
      app: epochdb-shard
  template:
    metadata:
      labels:
        app: epochdb-shard
    spec:
      containers:
      - name: shard
        image: jersobh/epochdb:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: NODE_MODE
          valueFrom:
            configMapKeyRef:
              name: epochdb-config
              key: NODE_MODE_SHARD
        - name: STORAGE_DIR
          value: "/data"
        - name: INTERNAL_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: epochdb-secrets
              key: INTERNAL_AUTH_TOKEN
        - name: EMBEDDING_MODEL
          valueFrom:
            configMapKeyRef:
              name: epochdb-config
              key: EMBEDDING_MODEL
        - name: EMBEDDING_DIM
          valueFrom:
            configMapKeyRef:
              name: epochdb-config
              key: EMBEDDING_DIM
        # Optionally mount /data volume to persist SQLite databases and HNSW indexes
        volumeMounts:
        - name: epochdb-shard-data
          mountPath: /data
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: "500m"
            memory: "1Gi"
        healthcheck:
          # Simple script check matched with the docker-compose healthcheck
          # In Kubernetes, we translate this to a liveness/readiness probe.
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: epochdb-shard-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      # If no storageClassName is specified, the default storage class of the cluster is used.
      # storageClassName: gp3
      resources:
        requests:
          storage: 10Gi
